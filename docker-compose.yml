services:
  postgres:
    image: postgres:15-alpine
    container_name: a_stock_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-a_stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-a_stock_2024}
      POSTGRES_DB: ${POSTGRES_DB:-a_stock_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - a_stock_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-a_stock}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: a_stock_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - a_stock_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a_stock_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-a_stock}:${POSTGRES_PASSWORD:-a_stock_2024}@postgres:5432/${POSTGRES_DB:-a_stock_db}
      REDIS_URL: redis://redis:6379/0
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      BACKEND_DEBUG: ${BACKEND_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      DATA_SOURCE: ${DATA_SOURCE:-eastmoney}
      ENABLE_ALERTS: ${ENABLE_ALERTS:-true}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL:-60}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - a_stock_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: a_stock_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - a_stock_network
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:

networks:
  a_stock_network:
    driver: bridge
